name: Windows

on:
  push:
    branches: [main]
    paths: ["windows/**", "docs/specs/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "docs/specs/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build windows/MuurMusic.sln -c Release
      - name: Test
        run: dotnet test windows/MuurMusic.sln -c Release --no-build --logger "trx;LogFileName=results.trx"
      - name: Publish app (x64, self-contained)
        run: dotnet publish windows/src/MuurMusic.App/MuurMusic.App.csproj -c Release -r win-x64 --self-contained true -o publish/MuurMusic-win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: MuurMusic-win-x64
          path: publish/MuurMusic-win-x64
